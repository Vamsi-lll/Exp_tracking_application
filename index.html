<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track it</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ---------------------- main containor ----------------- -->
     <div class="main-con">
        <h2>Track It</h2>
        <!-- ---------------------amount display--------------------- -->
         <div class="amt-con">
                <p>Budget : <input type="number" name="" id="bud_in"> </p>
                <p>Spent : 0</p>
                <p>Left : 0</p>
         </div>

         <!-- ------------------------  task input--------------- -->
          <input type="text" name="" id="task-in" class="task-in" required>

          <!-- ----------------------- button cont -------------- -->
           <div class="btn-con">
            <button class="btn" >🖶</button>
            <button class="btn" onclick=RESET()>⭯</button>
            <button class="btn" onclick=create_task()>+</button>
           </div>

          <!-- ----------------------- tasks display area ----- --> 
           <div class="task-display-con">
            <table id="task-table">

            </table>
           </div>
     </div>
    <script src="script.js"></script>
</body>
</html>
